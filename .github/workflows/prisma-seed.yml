name: Run Prisma Seed (manual)

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Enable corepack & prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install
        env:
          CI: false

      - name: Run seed script (Node ESM)
        run: node prisma/seed.mjs

      - name: Optionally commit prisma/dev.db if modified
        # Only useful if your SQLite dev.db is in repo under prisma/dev.db
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/dev.db || true
          git commit -m "chore(prisma): update dev.db after seed" || echo "no changes to commit"
          git push || echo "push failed (maybe no permission)"
