name: Run Prisma Seed (manual)

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run Prisma Migrate (generate tables in dev.db)
        run: npx prisma migrate deploy

      - name: Run Prisma Seed
        run: node prisma/seed.mjs

      - name: Commit updated dev.db back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/dev.db || true
          git commit -m "chore: updated dev.db with migrations + seed" || echo "no changes"
          git push || echo "push skipped"
